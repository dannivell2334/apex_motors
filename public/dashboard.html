<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Apex Motors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <div class="bg-slate-900 text-gray-300 text-xs py-2 px-4 sm:px-8 flex justify-between items-center border-b border-slate-800">
    <a href="/" class="hover:text-amber-400"><i class="fa-solid fa-arrow-left mr-1"></i> Back to site</a>
    <a href="order.html" class="hover:text-amber-400">Track a single order</a>
  </div>

  <nav class="bg-white sticky top-0 z-50 shadow-sm border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-8 py-4 flex justify-between items-center">
      <a href="/" class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
        <span class="bg-amber-500 text-slate-900 px-2 py-1 rounded text-lg">APEX</span> MOTORS
      </a>
      <div class="text-sm font-semibold text-gray-500 uppercase tracking-wider">My Orders</div>
    </div>
  </nav>

  <section class="py-16 max-w-3xl mx-auto px-4 sm:px-8">
    <form id="lookup" class="bg-white p-6 rounded-xl shadow-md border border-gray-100 mb-8 flex gap-3" onsubmit="return loadOrders(event)">
      <div class="flex-1">
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Enter your phone number</label>
        <input id="phoneInput" type="tel" placeholder="08012345678" required class="w-full text-sm p-3 border border-gray-300 rounded-md focus:outline-none focus:border-amber-500">
      </div>
      <button class="bg-slate-900 hover:bg-amber-500 hover:text-slate-950 text-white text-xs font-bold px-6 rounded-md transition self-end">Find My Orders</button>
    </form>

    <div id="orders" class="space-y-4"></div>
  </section>

  <script>
    const STATUS = {
      'quote': ['Quote received', 'text-amber-700 bg-amber-100'],
      'awaiting_payment': ['Payment pending', 'text-orange-700 bg-orange-100'],
      'paid': ['Payment received', 'text-green-700 bg-green-100'],
      'dispatched': ['Dispatched', 'text-blue-700 bg-blue-100'],
      'delivered': ['Delivered', 'text-green-700 bg-green-100'],
      'cancelled': ['Cancelled', 'text-red-700 bg-red-100']
    };

    async function loadOrders(e) {
      e.preventDefault();
      const phone = document.getElementById('phoneInput').value.trim();
      const box = document.getElementById('orders');
      box.innerHTML = '<div class="text-center text-sm text-gray-500 py-8">Loading...</div>';
      const res = await fetch('/api/orders?phone=' + encodeURIComponent(phone));
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) {
        box.innerHTML = '<div class="bg-white rounded-xl shadow-md border border-gray-100 p-6 text-center"><p class="text-sm text-gray-500">No orders found for this number. <a class="text-amber-600 font-bold" href="checkout.html">Place an order</a>.</p></div>';
        return false;
      }
      box.innerHTML = data.map(o => {
        const [label, cls] = STATUS[o.status] || ['-', 'bg-gray-100 text-gray-600'];
        return `<div class="bg-white rounded-xl shadow-md border border-gray-100 p-5 flex justify-between items-center gap-4">
          <div>
            <p class="font-bold text-slate-900 text-sm">${o.itemName}</p>
            <p class="text-xs text-gray-500 mt-1">${o.ref} &middot; ${o.createdAt}</p>
          </div>
          <div class="text-right">
            <p class="font-black text-slate-900">${o.total}</p>
            <span class="inline-block text-xs font-bold px-2 py-1 rounded-full mt-1 ${cls}">${label}</span>
          </div>
          <a href="order.html?ref=${o.ref}" class="text-xs font-bold text-amber-600 hover:underline whitespace-nowrap">Track &rarr;</a>
        </div>`;
      }).join('');
      return false;
    }
  </script>
  <script src="js/trust-bike.js"></script>
</body>
</html>
